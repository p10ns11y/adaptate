[package]
name = "adaptate-accel"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "In-memory payload verification and streaming UTF-8 JSON scanning for optional Adaptate acceleration"
readme = "README.md"

[lib]
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[features]
default = []
wasm = ["dep:wasm-bindgen"]
native = ["dep:napi", "dep:napi-derive", "dep:napi-build", "dep:unicode-segmentation"]
gpu = ["dep:wgpu", "dep:pollster", "dep:indexmap"]

[dependencies]
sha2 = "=0.10.8"
# Pins keep `cargo update` on the Rust 1.83 toolchain. Newer indexmap and
# unicode-segmentation releases need Rust 1.85.
indexmap = { version = "=2.7.1", optional = true }
unicode-segmentation = { version = "=1.12.0", optional = true }
wasm-bindgen = { version = "=0.2.100", optional = true }
napi = { version = "=2.16.17", default-features = false, features = ["napi4"], optional = true }
napi-derive = { version = "=2.16.13", optional = true }
wgpu = { version = "=23.0.1", optional = true }
pollster = { version = "=0.4.0", optional = true }

[build-dependencies]
napi-build = { version = "=2.1.6", optional = true }
