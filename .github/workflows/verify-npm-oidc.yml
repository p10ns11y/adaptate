name: Verify npm OIDC Connection (Dry Run)

on:
  workflow_dispatch:

jobs:
  verify-oidc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate --activate
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: npx turbo run build

      - name: Dry-run publish (OIDC + provenance, pnpm)
        run: |
          echo "=== Testing OIDC + Provenance ==="

          for dir in packages/core packages/utils; do
            if [ -f "$dir/package.json" ]; then
              echo ""
              echo ">>> Testing package: $dir"
              (cd "$dir" && pnpm publish --dry-run --provenance --access public)
            fi
          done

      - name: ✅ OIDC Connection Verified Successfully
        if: success()
        run: echo "✅ GitHub ↔ npmjs OIDC connection is working!"
