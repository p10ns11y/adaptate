name: Release

on:
  # Auto-trigger when version changes in package.json on main
  push:
    branches:
      - main
    paths:
      - 'package.json'

  # Manual trigger with version bump
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write          # Required for npm OIDC trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Check if version changed (auto-trigger)
        id: check
        if: github.event_name == 'push'
        run: |
          CURRENT=$(node -e "console.log(require('./package.json').version)")
          PREVIOUS=$(git show HEAD\~1:package.json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).version))")
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "Version changed: $PREVIOUS → $CURRENT"
          else
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "Version unchanged, skipping publish"
          fi

      - name: Set up Node.js
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.publish == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile

      - name: Configure git
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          NEW_VERSION=$(node -e "
            const pkg = require('./package.json');
            const [major, minor, patch] = pkg.version.replace(/[+-].*$/, '').split('.').map(Number);
            const bump = '${{ inputs.bump }}';
            if (bump === 'major') console.log((major+1) + '.0.0');
            else if (bump === 'minor') console.log(major + '.' + (minor+1) + '.0');
            else console.log(major + '.' + minor + '.' + (patch+1));
          ")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "Bumping to $NEW_VERSION"

          node -e "
            const fs = require('fs');
            const version = '$NEW_VERSION';
            const files = ['package.json', 'packages/core/package.json', 'packages/utils/package.json'];
            for (const file of files) {
              const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
              pkg.version = version;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
            }
          "

      - name: Read version (auto-trigger)
        if: github.event_name == 'push' && steps.check.outputs.publish == 'true'
        run: |
          echo "NEW_VERSION=$(node -e "console.log(require('./package.json').version)")" >> $GITHUB_ENV

      - name: Build
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.publish == 'true'
        run: npx turbo run build

      # ===Use npx instead of global install ===

      - name: Publish to npm (using npm CLI for OIDC + provenance)
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.publish == 'true'
        run: npx npm@latest publish --workspaces --provenance --access public

      - name: Commit and tag (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git add package.json packages/*/package.json
          git commit -m "chore: release v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin main --tags

      - name: Tag (auto-trigger)
        if: github.event_name == 'push' && steps.check.outputs.publish == 'true'
        run: |
          git tag "v${NEW_VERSION}"
          git push origin --tags
