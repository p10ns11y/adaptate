name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - rc
          - beta
          - alpha

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Check version changed (auto-trigger)
        id: check
        if: github.event_name == 'push'
        run: |
          CURRENT=$(node -e "console.log(require('./package.json').version)")
          PREVIOUS=$(git show HEAD\~1:package.json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).version))")
          echo "publish=$([ "$CURRENT" != "$PREVIOUS" ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.publish == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile

      - name: Configure git
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # === Improved Version Bump (supports pre-releases) ===
      - name: Bump version (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          NEW_VERSION=$(node -e "
            const pkg = require('./package.json');
            let version = pkg.version;
            const bump = '${{ inputs.bump }}';
            
            // Handle pre-release bumps
            if (['rc', 'beta', 'alpha'].includes(bump)) {
              const base = version.replace(/-[a-zA-Z0-9.]+$/, '');
              const prerelease = bump;
              console.log(base + '-' + prerelease + '.1');
            } else {
              // Normal semver bump
              const clean = version.replace(/[+-].*$/, '');
              const [major, minor, patch] = clean.split('.').map(Number);
              if (bump === 'major') console.log((major+1) + '.0.0');
              else if (bump === 'minor') console.log(major + '.' + (minor+1) + '.0');
              else console.log(major + '.' + minor + '.' + (patch+1));
            }
          ")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "Bumping to $NEW_VERSION"

          node -e "
            const fs = require('fs');
            const version = '$NEW_VERSION';
            const files = ['package.json', 'packages/core/package.json', 'packages/utils/package.json'];
            for (const file of files) {
              const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
              pkg.version = version;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
            }
          "

      - name: Read version (auto-trigger)
        if: github.event_name == 'push' && steps.check.outputs.publish == 'true'
        run: echo "NEW_VERSION=$(node -e "console.log(require('./package.json').version)")" >> $GITHUB_ENV

      - name: Build
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.publish == 'true'
        run: npx turbo run build

      # === PUBLISH ALL PACKAGES (including root) ===
      - name: Publish to npm (OIDC + Provenance)
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.publish == 'true'
        run: |
          echo "=== Publishing workspace packages ==="
          for dir in packages/core packages/utils; do
            if [ -f "$dir/package.json" ]; then
              echo ">>> Publishing: $dir"
              (cd "$dir" && npx npm@latest publish --provenance --access public)
            fi
          done

          echo ""
          echo "=== Publishing root package (adaptate) ==="
          npx npm@latest publish --provenance --access public

      - name: Commit and tag (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git add package.json packages/*/package.json
          git commit -m "chore: release v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin main --tags

      - name: Tag (auto-trigger)
        if: github.event_name == 'push' && steps.check.outputs.publish == 'true'
        run: |
          git tag "v${NEW_VERSION}"
          git push origin --tags