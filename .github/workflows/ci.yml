name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f

      - name: Setup Node.js
        uses: actions/setup-node@363be39a57dfa5801e05c6e0c549d622a376cf15
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: npx turbo run build

      - name: Verify @adaptate/core and @adaptate/utils publish types
        run: |
          node scripts/verify-published-types.mjs packages/core
          node scripts/verify-published-types.mjs packages/utils

  zod-latest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f

      - name: Setup Node.js
        uses: actions/setup-node@363be39a57dfa5801e05c6e0c549d622a376cf15
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install with latest zod
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm -r update zod@latest --ignore-scripts
          pnpm -r exec node -e "console.log(require('zod/package.json').version)"

      - name: Test on latest zod
        run: pnpm test
