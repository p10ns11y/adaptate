name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f

      - name: Setup Node.js
        uses: actions/setup-node@363be39a57dfa5801e05c6e0c549d622a376cf15
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: npx turbo run build --filter='!adaptate-site'

      - name: React view example
        run: pnpm --filter adaptate-react-view test

      - name: Live load example
        run: |
          pnpm --filter adaptate-live-load build
          pnpm --filter adaptate-live-load test

      - name: Verify @adaptate/core and @adaptate/utils publish types
        run: |
          node scripts/verify-published-types.mjs packages/core
          node scripts/verify-published-types.mjs packages/utils

      - name: API docs match the published declarations
        run: |
          pnpm docs:api
          node --test tools/api-docs/specifier-check.mjs
          if [ -n "$(git status --porcelain -- docs/api llms.txt llms-full.txt)" ]; then
            git status --porcelain -- docs/api llms.txt llms-full.txt
            git diff -- docs/api llms.txt llms-full.txt
            exit 1
          fi

      - name: Site changes
        id: site
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(apps/site/|docs/|README\.md$|llms(-full)?\.txt$|packages/[^/]+/src/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Site
        if: steps.site.outputs.run == 'true'
        timeout-minutes: 6
        run: |
          pnpm --filter adaptate-site exec playwright install --with-deps chromium
          pnpm --filter adaptate-site snippets:check
          pnpm --filter adaptate-site build
          pnpm --filter adaptate-site test
          pnpm --filter adaptate-site budget
          pnpm --filter adaptate-site seo-check
          pnpm --filter adaptate-site link-check
          pnpm --filter adaptate-site a11y

  zod-latest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f

      - name: Setup Node.js
        uses: actions/setup-node@363be39a57dfa5801e05c6e0c549d622a376cf15
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install with latest zod
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm -r --filter '!@adaptate/api-docs' --filter '!@adaptate/accel' --filter '!@adaptate/wasm' --filter '!@adaptate/native' update zod@latest --ignore-scripts
          pnpm -r --filter '!@adaptate/api-docs' --filter '!@adaptate/accel' --filter '!@adaptate/wasm' --filter '!@adaptate/native' exec node -e "console.log(require('zod/package.json').version)"

      - name: Test on latest zod
        run: pnpm test

  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@363be39a57dfa5801e05c6e0c549d622a376cf15
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build head and base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          npx turbo run build --filter=@adaptate/core
          git worktree add ../base "$BASE_SHA"
          cd ../base
          pnpm install --frozen-lockfile --ignore-scripts
          npx turbo run build --filter=@adaptate/core

      - name: Compare (fail if any case is more than 5% slower)
        run: node scripts/bench-compare.mjs ../base . 1.05

  ts7-consumer:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f

      - name: Setup Node.js
        uses: actions/setup-node@363be39a57dfa5801e05c6e0c549d622a376cf15
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: npx turbo run build --filter='!adaptate-site'

      - name: Typecheck packed tarballs on TypeScript 7 and 6
        run: node scripts/ts-consumer-check.mjs

  ab-eval:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@363be39a57dfa5801e05c6e0c549d622a376cf15
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.5"

      - name: Install and build head and base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          npx turbo run build --filter=@adaptate/core
          git worktree add ../base "$BASE_SHA"
          cd ../base
          pnpm install --frozen-lockfile --ignore-scripts
          npx turbo run build --filter=@adaptate/core
          cd -
          pnpm --filter @adaptate/ab-bench exec playwright install --with-deps chromium

      - name: Measure Node, Bun, Chromium, and bundle size
        run: node bench/ab/run.js

      - name: Gate Node head against base
        run: node bench/ab/compare.js ../base . 1.05

      - name: Job summary
        if: always()
        run: node bench/ab/summarize.js bench/ab/results >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ab-eval-results
          path: bench/ab/results
          if-no-files-found: error
